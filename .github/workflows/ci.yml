name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    uses: ./.github/workflows/runner-select.yml
  validate:
    needs: routing
    runs-on: ${{ fromJSON(needs.routing.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_config.py
      - run: shellcheck runner/install.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check zizmor==1.30.1
          .venv/bin/zizmor --offline --min-severity medium .github/workflows
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm exec --yes --package=renovate@44.108.1 -- renovate-config-validator --strict renovate-config.json renovate-node.json renovate-cloudflare.json
  ci:
    name: ci
    needs: [routing, validate]
    if: always()
    runs-on: [self-hosted, Linux, X64, vyamoh-do-light]
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.validate.result }}
          ROUTING_RESULT: ${{ needs.routing.result }}
        run: test "$RESULT" = success && test "$ROUTING_RESULT" = success
