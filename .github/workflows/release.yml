name: Release shared automation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-shared-automation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/release.py
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
